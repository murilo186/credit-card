services:
  api:
    image: card-limit-api:development
    build:
      context: .
      target: development
    environment:
      APP_NAME: ${APP_NAME:-Card Limit API}
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://card_user:example_password@db:5432/card_limit}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - .:/app
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    stop_signal: SIGTERM
    stop_grace_period: 30s
    healthcheck:
      test:
        ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend
    command: >
      sh -c 'if [ "$$APP_ENV" = "development" ]; then
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --timeout-graceful-shutdown 25;
      else exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --timeout-graceful-shutdown 25; fi'

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-card_limit}
      POSTGRES_USER: ${POSTGRES_USER:-card_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-example_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - backend

  docs:
    image: squidfunk/mkdocs-material:latest
    profiles: ["docs"]
    working_dir: /docs
    volumes:
      - .:/docs:ro
    ports:
      - "8000:8000"
    command: serve --dev-addr=0.0.0.0:8000

volumes:
  postgres_data:

networks:
  backend:
    internal: true
