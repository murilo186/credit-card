services:
  api:
    image: card-limit-api:production
    build:
      context: .
      target: production
    environment:
      APP_ENV: production
    user: app
    volumes: !reset []
    # Substitui a porta de desenvolvimento (8001) pela porta privada usada pelo Nginx.
    ports: !override
      - "127.0.0.1:8000:8000"
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--timeout-graceful-shutdown",
        "25",
      ]

  docs:
    profiles: ["docs"]

# Em produção o Nginx instalado na EC2 alcança a API pela porta publicada em
# loopback. O PostgreSQL permanece sem porta publicada.
networks:
  backend:
    internal: false
