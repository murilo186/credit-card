services:
  api:
    image: card-limit-api:production
    build:
      context: .
      target: production
    environment:
      APP_ENV: production
    user: app
    volumes: !reset []
    ports: !reset
      - "127.0.0.1:8001:8000"
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--timeout-graceful-shutdown",
        "25",
      ]

  docs:
    profiles: ["docs"]
